name: Publish Container

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to publish (for example v1.2.3)
        required: true
        type: string

jobs:
  # This pushes the image to GitHub Packages.
  push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Resolve release and image tags
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$/.test(tag)) {
              throw new Error('Release tag must be a valid container tag (1-128 letters, digits, underscores, dots or hyphens; no leading dot or hyphen).');
            }

            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag
            });
            if (release.draft) {
              throw new Error('Publish the GitHub release before publishing its container.');
            }

            let latestTag;
            try {
              const { data: latest } = await github.rest.repos.getLatestRelease(context.repo);
              latestTag = latest.tag_name;
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('No latest published release; only the version image tag will be pushed.');
            }

            const image = `ghcr.io/${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const tags = [`${image}:${tag}`];
            if (tag === latestTag) tags.push(`${image}:latest`);
            core.setOutput('ref', `refs/tags/${tag}`);
            core.setOutput('tags', tags.join('\n'));

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
